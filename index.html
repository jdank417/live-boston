<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Every T train, commuter rail, Silver Line bus, ferry and Amtrak train around Boston, live in 3D, with service alerts and your commute."
    />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Live Boston" />
    <!-- Link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Live Boston" />
    <meta property="og:title" content="Live Boston" />
    <meta
      property="og:description"
      content="Every T train, ferry and Amtrak train around Boston, live in 3D. Service alerts, bunching, your commute, and the city's real sky."
    />
    <meta property="og:url" content="https://jdank417.github.io/live-boston/" />
    <meta property="og:image" content="https://jdank417.github.io/live-boston/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Boston's subway and commuter rail trains in 3D over a dark map of the city" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Live Boston" />
    <meta name="twitter:description" content="Every T train, ferry and Amtrak train around Boston, live in 3D." />
    <meta name="twitter:image" content="https://jdank417.github.io/live-boston/og.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a0c10'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2334d399'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Live Boston</title>
  </head>
  <body>
    <div id="map"></div>
    <canvas id="weather-fx" aria-hidden="true"></canvas>

    <aside id="sheet" data-tab="lines" aria-label="Live Boston">
      <div class="grabber" aria-hidden="true"></div>
      <header class="top">
        <div class="brand">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="2.6" />
            <circle cx="16" cy="16" r="3.6" fill="#34d399" />
          </svg>
          <div>
            <h1>Live Boston</h1>
            <p id="status"><span class="pulse" aria-hidden="true"></span><span id="status-text" role="status">Connecting…</span></p>
          </div>
        </div>
        <div class="now">
          <div id="clock" aria-label="Boston time"></div>
          <div id="conditions"></div>
        </div>
      </header>
      <button id="commute" class="commute" aria-label="My commute" hidden></button>
      <div class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input
          id="search"
          type="search"
          placeholder="Stations, lines, trains, boats"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="search"
          aria-label="Search"
          aria-controls="view-search"
        />
        <kbd aria-hidden="true">/</kbd>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="lines" aria-selected="true">Lines</button>
        <button role="tab" data-tab="alerts" aria-selected="false">
          Alerts <span id="alerts-count" class="badge warn" hidden>0</span>
        </button>
        <button role="tab" data-tab="following" aria-selected="false">
          Following <span id="following-count" class="badge" hidden>0</span>
        </button>
        <button role="tab" data-tab="map" aria-selected="false">Map</button>
        <span class="tab-indicator" aria-hidden="true"></span>
      </nav>
      <div class="views">
        <section id="view-main" class="view"></section>
        <section id="view-detail" class="view detail" aria-live="polite"></section>
        <section id="view-search" class="view search-view"></section>
      </div>
    </aside>

    <div id="speed-legend" hidden></div>

    <div id="map-controls">
      <div class="control-group">
        <button id="zoom-in" class="zoom" aria-label="Zoom in">
          <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
        </button>
        <button id="zoom-out" class="zoom" aria-label="Zoom out">
          <svg viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>
        </button>
      </div>
      <button id="locate" aria-label="Show where I am" aria-pressed="false" title="Show where I am">
        <svg viewBox="0 0 16 16">
          <circle cx="8" cy="8" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle cx="8" cy="8" r="1.6" fill="currentColor" />
          <path d="M8 1.2v2.2M8 12.6v2.2M1.2 8h2.2M12.6 8h2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
      <button id="compass" aria-label="Point north">
        <svg viewBox="0 0 16 16">
          <path d="M8 1.5 10.5 8h-5z" fill="#f87171" />
          <path d="M8 14.5 5.5 8h5z" fill="currentColor" opacity="0.55" />
        </svg>
      </button>
      <button id="overview" aria-label="Show the whole system">
        <svg viewBox="0 0 16 16">
          <path
            d="M2.5 6V3.5a1 1 0 0 1 1-1H6M10 2.5h2.5a1 1 0 0 1 1 1V6M13.5 10v2.5a1 1 0 0 1-1 1H10M6 13.5H3.5a1 1 0 0 1-1-1V10"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </div>

    <div id="hud" hidden></div>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <div id="match" role="status" aria-live="polite" hidden></div>

    <div id="tip" role="status" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M15.5 10a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <path d="M14.5 2.8v3.6h-3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span></span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
