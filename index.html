<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Boston in real time: every T, commuter rail and Silver Line vehicle in 3D, Bluebikes, and the city's real sky and weather." />
    <meta name="theme-color" content="#090c13" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <title>Live Boston</title>
  </head>
  <body>
    <div id="map"></div>
    <canvas id="weather-fx" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <header id="brand">
      <div class="title"><span class="live" aria-hidden="true"></span>Live Boston</div>
      <div id="clock" aria-label="Boston time"></div>
      <p id="conditions" hidden></p>
      <p id="summary" role="status"></p>
      <div class="controls">
        <button id="tour" aria-pressed="false" title="Ride random trains around the city">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor" /></svg>
          <span class="label">Tour</span>
        </button>
        <button id="following-btn" aria-pressed="false" title="Trains you follow">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="m8 1.5 1.9 4 4.4.5-3.3 3 .9 4.3L8 11.1l-3.9 2.2.9-4.3-3.3-3 4.4-.5z" fill="currentColor" />
          </svg>
          <span class="label">Following</span><span class="badge" hidden>0</span>
        </button>
        <div class="seg" role="group" aria-label="Map view">
          <button data-view="2d" aria-pressed="false">2D</button>
          <button data-view="3d" aria-pressed="true">3D</button>
        </div>
        <button id="overview" title="Back to the whole map">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 2 2 7h1.5v6h3.5V9.5h2V13h3.5V7H14z" fill="currentColor" />
          </svg>
          <span class="label">Overview</span>
        </button>
      </div>
    </header>

    <p id="notice" role="alert" hidden></p>

    <section id="panel" hidden aria-live="polite"></section>

    <div id="speed-legend" hidden></div>
    <nav id="dock" aria-label="Lines and layers"></nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
